<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>STOCK API · 接口文档</title>
<script>
  // 提前应用主题，避免刷新时闪白
  try {
    var t = localStorage.getItem('boycot-theme')
    if (!t) t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
    document.documentElement.dataset.theme = t
  } catch (e) {}
</script>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0f19;
    --glow-a: #1b2b4d;
    --glow-b: #16324a;
    --panel: rgba(255, 255, 255, .035);
    --panel-2: rgba(255, 255, 255, .06);
    --line: rgba(255, 255, 255, .09);
    --text: #e7eaf1;
    --muted: #949eb5;
    --dim: #6c768c;
    --get: #34d399;
    --post: #60a5fa;
    --accent: #7cc4ff;
    --header-bg: rgba(11, 15, 25, .82);
    --code-bg: rgba(0, 0, 0, .42);
    --code-text: #cbd5e1;
    --hero-a: rgba(79, 140, 255, .13);
    --hero-b: rgba(34, 211, 238, .06);
    --ok: #34d399;
    --err: #f87171;
    --j-key: #7cc4ff;
    --j-str: #9ae6b4;
    --j-num: #f0b37e;
    --j-bool: #c4b5fd;
    --j-null: #94a3b8;
    --shadow: 0 18px 44px rgba(0, 0, 0, .38);
  }
  html[data-theme="light"] {
    color-scheme: light;
    --bg: #f5f7fb;
    --glow-a: #dce7ff;
    --glow-b: #d9eef8;
    --panel: #ffffff;
    --panel-2: rgba(15, 23, 42, .035);
    --line: rgba(15, 23, 42, .11);
    --text: #16202f;
    --muted: #55617a;
    --dim: #7b8698;
    --get: #0f9d63;
    --post: #2563eb;
    --accent: #1d6fe0;
    --header-bg: rgba(245, 247, 251, .86);
    --code-bg: rgba(15, 23, 42, .045);
    --code-text: #334155;
    --hero-a: rgba(37, 99, 235, .09);
    --hero-b: rgba(14, 165, 233, .06);
    --ok: #0f9d63;
    --err: #dc2626;
    --j-key: #1d6fe0;
    --j-str: #0f8a4d;
    --j-num: #b45309;
    --j-bool: #7c3aed;
    --j-null: #64748b;
    --shadow: 0 14px 34px rgba(15, 23, 42, .08);
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background:
      radial-gradient(1100px 520px at 18% -12%, var(--glow-a) 0%, transparent 60%),
      radial-gradient(900px 480px at 92% 0%, var(--glow-b) 0%, transparent 55%),
      var(--bg);
    color: var(--text);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    transition: background-color .2s, color .2s;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .path, .chip, pre { font-family: var(--mono); }
  :root { --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    backdrop-filter: blur(14px);
    background: var(--header-bg);
    border-bottom: 1px solid var(--line);
  }
  .head-inner {
    max-width: 1240px; margin: 0 auto; padding: 14px 24px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .logo {
    width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center;
    background: linear-gradient(140deg, #4f8cff, #22d3ee); font-weight: 700; font-size: 15px; color: #06101f;
  }
  .brand { min-width: 0; }
  .brand > div { min-width: 0; }
  .brand h1 { margin: 0; font-size: 17px; letter-spacing: .3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand span { display: block; font-size: 12px; color: var(--dim); font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .status {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 5px 12px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--panel); font-size: 12.5px; color: var(--muted);
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #64748b; }
  .status.ok .dot { background: var(--ok); box-shadow: 0 0 9px var(--ok); }
  .status.ok { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
  .status.err .dot { background: var(--err); box-shadow: 0 0 9px var(--err); }
  .status.err { color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, transparent); }

  .search { position: relative; flex: 1 1 240px; max-width: 320px; }
  .search input {
    width: 100%; padding: 9px 14px 9px 34px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--text);
    font-size: 13.5px; outline: none;
  }
  .search input:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); opacity: .45; }

  .icon-btn {
    width: 36px; height: 36px; flex: none; display: grid; place-items: center;
    border-radius: 10px; border: 1px solid var(--line); background: var(--panel);
    color: var(--muted); cursor: pointer; padding: 0;
  }
  .icon-btn:hover { background: var(--panel-2); color: var(--text); }
  html[data-theme="dark"] .i-sun { display: block; }
  html[data-theme="dark"] .i-moon { display: none; }
  html[data-theme="light"] .i-sun { display: none; }
  html[data-theme="light"] .i-moon { display: block; }

  /* ---------- layout ---------- */
  .wrap { max-width: 1240px; margin: 0 auto; padding: 26px 24px; display: flex; gap: 28px; align-items: flex-start; }
  nav { position: sticky; top: 76px; width: 208px; flex: none; max-height: calc(100vh - 100px); overflow: auto; }
  nav h4 { margin: 0 0 10px; font-size: 11px; letter-spacing: 1.2px; color: var(--dim); text-transform: uppercase; }
  nav a {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: 7px 11px; border-radius: 8px; color: var(--muted); font-size: 13.5px;
  }
  nav a:hover { background: var(--panel-2); color: var(--text); text-decoration: none; }
  nav a .cnt { font-size: 11px; color: var(--dim); font-family: var(--mono); }
  main { flex: 1; min-width: 0; }

  /* ---------- hero ---------- */
  .hero {
    padding: 26px 28px; border: 1px solid var(--line); border-radius: 16px;
    background: linear-gradient(150deg, var(--hero-a), var(--hero-b));
    box-shadow: var(--shadow); margin-bottom: 26px;
  }
  .hero h2 { margin: 0 0 8px; font-size: 24px; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; max-width: 760px; }
  .hero .meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .chip {
    font-size: 12px; padding: 4px 10px; border-radius: 7px;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--muted);
  }
  .hero .auth { margin-top: 14px; font-size: 13px; color: var(--muted); }
  .hero .auth code { font-size: 12.5px; color: var(--accent); }

  /* ---------- module ---------- */
  section { margin-bottom: 30px; scroll-margin-top: 84px; }
  section > h3 { margin: 0 0 12px; font-size: 16px; display: flex; align-items: center; gap: 10px; }
  section > h3 .bar {
    width: 4px; height: 18px; border-radius: 2px; flex: none;
    background: linear-gradient(180deg, #4c8bf5, #2f6fed);
  }
  section > h3 small { color: var(--dim); font-weight: 400; font-size: 12.5px; }

  /* 接口行：徽标 | 路径 | 说明（右对齐） | 箭头 —— 四列网格，
     窄屏时路径与说明各自截断，不会互相挤压导致溢出 */
  .ep {
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
    margin-bottom: 8px; overflow: hidden;
  }
  html[data-theme="light"] .ep { box-shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 1px 3px rgba(15, 23, 42, .04); }
  .ep-head {
    display: grid;
    grid-template-columns: auto minmax(0, auto) minmax(0, 1fr) auto;
    align-items: center; gap: 10px;
    padding: 12px 13px; cursor: pointer;
  }
  .ep-head:hover { background: var(--panel-2); }
  .method {
    font-family: var(--mono); font-size: 11px; font-weight: 700; letter-spacing: .6px;
    padding: 4px 8px; border-radius: 6px; flex: none; min-width: 50px; text-align: center;
  }
  .method.GET { color: var(--get); background: color-mix(in srgb, var(--get) 13%, transparent); border: 1px solid color-mix(in srgb, var(--get) 32%, transparent); }
  .method.POST { color: var(--post); background: color-mix(in srgb, var(--post) 13%, transparent); border: 1px solid color-mix(in srgb, var(--post) 32%, transparent); }
  .path {
    font-family: var(--mono); font-size: 13.5px; font-weight: 600; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .desc {
    color: var(--dim); font-size: 12.5px; text-align: right; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .caret {
    flex: none; color: var(--dim); font-size: 19px; line-height: 1;
    transform: translateY(-1px); transition: transform .18s;
  }
  .ep.open .caret { transform: translateY(-1px) rotate(90deg); }

  .ep-body { display: none; padding: 0 13px 15px; border-top: 1px solid var(--line); }
  .ep.open .ep-body { display: block; }
  .ep-body h5 { margin: 14px 0 8px; font-size: 12px; color: var(--dim); letter-spacing: .6px; text-transform: uppercase; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 11.5px; text-transform: uppercase; letter-spacing: .5px; }
  td code { font-family: var(--mono); font-size: 12.5px; color: var(--accent); }
  .req { color: var(--err); font-size: 11px; margin-left: 4px; }
  .enum { color: var(--dim); font-size: 11.5px; display: block; margin-top: 2px; font-family: var(--mono); }

  .try { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-top: 4px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld label { font-size: 11.5px; color: var(--muted); font-family: var(--mono); }
  .fld input {
    padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line);
    background: var(--panel-2); color: var(--text); font-size: 13px; min-width: 150px; outline: none;
  }
  .fld input:focus { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }

  button {
    padding: 8px 15px; border-radius: 8px; border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
    background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent);
    font-size: 13px; cursor: pointer;
  }
  button:hover { background: color-mix(in srgb, var(--accent) 26%, transparent); }
  button.ghost { border-color: var(--line); background: var(--panel-2); color: var(--muted); }
  button.ghost:hover { color: var(--text); }

  /* ---------- response ---------- */
  .resp {
    margin-top: 12px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
    background: var(--code-bg);
  }
  .resp-bar {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px;
    border-bottom: 1px solid var(--line); background: var(--panel-2);
  }
  .resp-bar .chip { font-size: 11.5px; }
  .resp-bar .chip.s2 { color: var(--ok); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
  .resp-bar .chip.s4, .resp-bar .chip.s5 { color: var(--err); border-color: color-mix(in srgb, var(--err) 35%, transparent); }
  .resp-bar button { margin-left: auto; padding: 4px 10px; font-size: 12px; }
  pre {
    margin: 0; padding: 13px 14px; overflow: auto; max-height: 340px;
    font-size: 12.4px; line-height: 1.6; color: var(--code-text); white-space: pre-wrap; word-break: break-word;
  }
  .j-key { color: var(--j-key); }
  .j-str { color: var(--j-str); }
  .j-num { color: var(--j-num); }
  .j-bool { color: var(--j-bool); }
  .j-null { color: var(--j-null); font-style: italic; }

  .note { font-size: 12.5px; color: var(--dim); margin-top: 8px; }
  .empty { color: var(--dim); padding: 30px; text-align: center; }

  /* ---------- 平板 / 移动端 ---------- */
  @media (max-width: 900px) {
    .head-inner { padding: 12px 16px; }
    .wrap { display: block; padding: 18px 16px; }

    /* 侧边导航降级为横向可滑动的模块胶囊条 */
    nav {
      position: static; width: auto; max-height: none; overflow: visible;
      margin-bottom: 16px;
    }
    nav h4 { display: none; }
    #nav-list {
      display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 8px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    #nav-list::-webkit-scrollbar { display: none; }
    #nav-list a {
      flex: none; white-space: nowrap; padding: 6px 13px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--panel); font-size: 13px;
    }
    #nav-list a .cnt { display: none; }

    .hero { padding: 20px; border-radius: 14px; }
    .hero h2 { font-size: 20px; }
    .hero p { font-size: 13.5px; }
  }

  /* ---------- 手机：头部两行 —— 标题+状态+主题按钮 / 搜索框占满整行 ---------- */
  @media (max-width: 720px) {
    .head-inner {
      display: grid;
      grid-template-columns: auto auto 1fr;
      grid-template-areas:
        "brand status theme"
        "search search search";
      align-items: center;
      gap: 8px 10px;
      padding: 12px 16px;
    }
    .brand { grid-area: brand; margin-right: 0; min-width: 0; }
    .status { grid-area: status; }
    #theme { grid-area: theme; justify-self: end; }
    .search { grid-area: search; max-width: none; width: 100%; }

    .ep-head { gap: 8px; padding: 11px 12px; }
    .method { min-width: 46px; font-size: 10.5px; padding: 3px 7px; }
    .path { font-size: 12.5px; }
    .desc { font-size: 11.5px; }
    .caret { font-size: 17px; }
    .ep-body { padding: 0 12px 14px; }
    th, td { padding: 6px 8px; }
    table { font-size: 12.5px; }

    .fld { flex: 1 1 140px; }
    .fld input { min-width: 0; width: 100%; }
    .try button { flex: 1 1 auto; }
    .resp-bar { flex-wrap: wrap; }
    .resp-bar button { margin-left: 0; }
    pre { font-size: 12px; padding: 11px 12px; }
  }

  /* ---------- 小屏：进一步压缩，副标题让位给标题 ---------- */
  @media (max-width: 420px) {
    .brand span { display: none; }
    .brand h1 { font-size: 15.5px; }
    .logo { width: 30px; height: 30px; border-radius: 9px; }
    .status { padding: 4px 9px; font-size: 12px; }
    .hero { padding: 16px; }
    .hero .meta { gap: 6px; }
    .chip { font-size: 11.5px; padding: 3px 9px; }
  }
</style>
</head>
<body>

<header>
  <div class="head-inner">
    <div class="brand">
      <div class="logo">S</div>
      <div>
        <h1>STOCK API</h1>
        <span>EdgeOne Pages · Edge Functions</span>
      </div>
    </div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
        <circle cx="11" cy="11" r="7" /><path d="M20 20l-3.5-3.5" />
      </svg>
      <input id="q" type="search" placeholder="搜索接口或路径，如 quote / kline" autocomplete="off" />
    </div>
    <div class="status" id="status"><span class="dot"></span><span id="status-text">检测中…</span></div>
    <button class="icon-btn" id="theme" title="切换深色 / 亮色主题" aria-label="切换主题">
      <svg class="i-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4.2" />
        <path d="M12 2.6v2.2M12 19.2v2.2M2.6 12h2.2M19.2 12h2.2M5.4 5.4l1.6 1.6M17 17l1.6 1.6M18.6 5.4L17 7M7 17l-1.6 1.6" />
      </svg>
      <svg class="i-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z" />
      </svg>
    </button>
  </div>
</header>

<div class="wrap">
  <nav id="nav"><h4>接口模块</h4><div id="nav-list"></div></nav>
  <main id="main"></main>
</div>

<script>
const API = [
  {
    id: 'market', name: '行情', desc: '大盘指数 / 个股行情 / 排行 / 盘口',
    items: [
      { m: 'GET', p: '/api/v1/market/index', d: '大盘指数列表（上证 / 深证 / 创业板 / 科创50 等 8 大指数）', params: [] },
      { m: 'GET', p: '/api/v1/stock/quote', d: '个股实时行情',
        params: [{ n: 'code', t: 'string', req: true, d: '6 位股票代码，如 600519' }] },
      { m: 'GET', p: '/api/v1/stock/search', d: '搜索股票（代码 / 名称 / 拼音）',
        params: [{ n: 'keyword', t: 'string', req: true, d: '搜索关键词，最多返回 10 条' }] },
      { m: 'GET', p: '/api/v1/market/rank', d: '行情排行榜',
        params: [
          { n: 'type', t: 'string', d: '排行类型，默认 rise', e: 'rise 涨幅榜 / fall 跌幅榜 / volume 成交量榜 / amount 成交额榜' },
          { n: 'count', t: 'number', d: '返回条数，默认 20' }] },
      { m: 'GET', p: '/api/v1/stock/depth', d: '盘口买卖档位',
        params: [{ n: 'code', t: 'string', req: true, d: '6 位股票代码' }] }
    ]
  },
  {
    id: 'kline', name: 'K线', desc: '日 / 周 / 月 / 分钟 K 线与分时数据',
    items: [
      { m: 'GET', p: '/api/v1/stock/kline', d: 'K线数据（含 5 / 10 / 20 日均线）',
        params: [
          { n: 'code', t: 'string', req: true, d: '6 位股票代码' },
          { n: 'period', t: 'string', d: '周期，默认 day', e: 'day / week / month / 1min / 5min / 15min / 30min / 60min' },
          { n: 'count', t: 'number', d: '数据条数，默认 100' }] },
      { m: 'GET', p: '/api/v1/stock/time-kline', d: '当日分时数据（5 秒缓存）',
        note: '成交量带符号：放量为正、缩量为负，用于分时图红绿柱渲染。',
        params: [{ n: 'code', t: 'string', req: true, d: '6 位股票代码' }] },
      { m: 'GET', p: '/api/v1/stock/five-day-time-kline', d: '5 日分时数据（5 秒缓存）',
        params: [{ n: 'code', t: 'string', req: true, d: '6 位股票代码' }] }
    ]
  },
  {
    id: 'holdings', name: '基金持仓', desc: '基金重仓股与指数成分股',
    items: [
      { m: 'GET', p: '/api/v1/stock/holdings', d: '基金 / 指数成分股列表',
        params: [{ n: 'code', t: 'string', req: true, d: '基金或指数代码（00 / 15 / 16 / 51 / 52 / 58 或 000 / 399 开头）' }] }
    ]
  },
  {
    id: 'selfstock', name: '自选股', desc: '需登录：X-User-Id 或 Bearer Token',
    items: [
      { m: 'GET', p: '/api/v1/user/self-stocks', d: '获取自选股列表（含实时行情）', auth: true, params: [] },
      { m: 'POST', p: '/api/v1/user/self-stock', d: '添加 / 删除 / 排序自选股', auth: true, body: true,
        params: [
          { n: 'action', t: 'string', req: true, d: '操作类型', e: 'add 添加 / delete 删除 / order 排序' },
          { n: 'code', t: 'string', d: '单个 6 位股票代码' },
          { n: 'codes', t: 'string[]', d: '批量代码数组，如 ["600519","000001"]' }] }
    ]
  },
  {
    id: 'user', name: '用户', desc: '注册 / 登录 / Token 认证',
    items: [
      { m: 'POST', p: '/api/v1/user/register', d: '用户注册（注册后自动登录）', body: true,
        params: [
          { n: 'username', t: 'string', req: true, d: '用户名，3-20 位' },
          { n: 'password', t: 'string', req: true, d: '密码，6-32 位' },
          { n: 'email', t: 'string', d: '邮箱，选填' }] },
      { m: 'POST', p: '/api/v1/user/login', d: '用户登录', body: true,
        params: [
          { n: 'username', t: 'string', req: true, d: '用户名' },
          { n: 'password', t: 'string', req: true, d: '密码' }] }
    ]
  },
  {
    id: 'news', name: '资讯', desc: '财经新闻与个股动态',
    items: [
      { m: 'GET', p: '/api/v1/news/list', d: '财经资讯列表',
        params: [
          { n: 'category', t: 'string', d: '资讯分类，默认 economy', e: 'stock / fund / bond / forex / futures / global / economy / company' },
          { n: 'page', t: 'number', d: '页码，默认 1' },
          { n: 'count', t: 'number', d: '每页条数，默认 20，最大 50' },
          { n: 'code', t: 'string', d: '选填，传入后返回该个股相关资讯与行情' }] }
    ]
  },
  {
    id: 'misc', name: '工具', desc: '节假日查询 / 健康检查',
    items: [
      { m: 'GET', p: '/api/v1/holiday', d: '节假日 / 工作日查询',
        params: [{ n: 'date', t: 'string', d: '日期 YYYY-MM-DD，默认今天' }] },
      { m: 'GET', p: '/api/v1/index', d: '健康检查', params: [] }
    ]
  }
]

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))

// JSON 语法高亮：逐段扫描，先转义再包 span，避免破坏结构
const TOKEN = /("(?:\\.|[^"\\])*")|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|null)\b/g
function highlight (text) {
  let out = '', last = 0, m
  TOKEN.lastIndex = 0
  while ((m = TOKEN.exec(text)) !== null) {
    out += esc(text.slice(last, m.index))
    if (m[1] !== undefined) {
      const isKey = /^\s*:/.test(text.slice(m.index + m[1].length))
      out += `<span class="j-${isKey ? 'key' : 'str'}">${esc(m[1])}</span>`
    } else if (m[2] !== undefined) {
      out += `<span class="j-num">${esc(m[2])}</span>`
    } else {
      out += `<span class="j-${m[3] === 'null' ? 'null' : 'bool'}">${esc(m[3])}</span>`
    }
    last = m.index + m[0].length
  }
  return out + esc(text.slice(last))
}

function findItem (key) {
  const i = key.lastIndexOf('-')
  return API.find(g => g.id === key.slice(0, i)).items[Number(key.slice(i + 1))]
}

function render () {
  const kw = document.getElementById('q').value.trim().toLowerCase()
  const nav = document.getElementById('nav-list')
  const main = document.getElementById('main')
  nav.innerHTML = ''
  let html = ''
  let total = 0

  API.forEach(g => {
    const items = g.items.filter(it =>
      !kw || (it.p + it.d + it.params.map(p => p.n).join(' ')).toLowerCase().includes(kw))
    if (!items.length) return
    total += items.length
    nav.insertAdjacentHTML('beforeend',
      `<a href="#${g.id}"><span>${g.name}</span><span class="cnt">${items.length}</span></a>`)

    html += `<section id="${g.id}"><h3><span class="bar"></span>${g.name}<small>${g.desc}</small></h3>`

    items.forEach((it, i) => {
      const key = g.id + '-' + i
      const rows = it.params.length
        ? `<table><thead><tr><th style="width:22%">参数</th><th style="width:14%">类型</th><th>说明</th></tr></thead><tbody>
            ${it.params.map(p => `<tr>
              <td><code>${esc(p.n)}</code>${p.req ? '<span class="req">必填</span>' : ''}</td>
              <td>${esc(p.t)}</td>
              <td>${esc(p.d || '')}${p.e ? `<span class="enum">${esc(p.e)}</span>` : ''}</td></tr>`).join('')}
           </tbody></table>`
        : '<p class="note">无参数</p>'

      const tryBox = it.noTry
        ? `<p class="note">${esc(it.note || '该接口需构造 multipart 请求，请在客户端调用。')}</p>`
        : `<div class="try">${it.params.map(p => `
             <div class="fld"><label>${esc(p.n)}</label><input data-p="${esc(p.n)}" data-t="${p.t}" placeholder="${esc(p.e || p.t)}" /></div>`).join('')}
             ${it.auth ? `<div class="fld"><label>X-User-Id</label><input data-h="x-user-id" placeholder="登录后的用户 ID" /></div>` : ''}
             <button data-run="${key}">发送</button>
             <button class="ghost" data-copy="${esc(it.p)}">复制路径</button>
           </div>
           <div class="resp" data-out="${key}" hidden>
             <div class="resp-bar">
               <span class="chip" data-st></span>
               <span class="chip" data-ms hidden></span>
               <button class="ghost" data-copyresp>复制响应</button>
             </div>
             <pre data-body></pre>
           </div>`

      html += `<div class="ep" data-key="${key}">
        <div class="ep-head">
          <span class="method ${it.m}">${it.m}</span>
          <span class="path">${esc(it.p)}</span>
          <span class="desc">${esc(it.d)}</span>
          <span class="caret">›</span>
        </div>
        <div class="ep-body">
          <h5>请求参数</h5>${rows}
          ${it.note ? `<p class="note">${esc(it.note)}</p>` : ''}
          <h5>调试</h5>${tryBox}
        </div>
      </div>`
    })
    html += '</section>'
  })

  main.innerHTML = html
    ? `<div class="hero">
        <h2>股票数据接口总览</h2>
        <p>基于 EdgeOne Pages 边缘函数（Edge Functions）构建的股票数据服务，数据源为新浪财经 / 东方财富。所有接口返回统一结构 <code>{ code, msg, data }</code>，<code>code = 0</code> 表示成功，并已开启 CORS。</p>
        <div class="auth">需要登录的接口支持 <code>X-User-Id: &lt;userId&gt;</code> 请求头或 <code>Authorization: Bearer &lt;token&gt;</code>，Token 由注册 / 登录接口返回，有效期 7 天。</div>
        <div class="meta">
          <span class="chip">Base: /api/v1</span>
          <span class="chip">${total} 个接口</span>
          <span class="chip">Runtime: Edge Functions</span>
          <span class="chip">Region: EdgeOne</span>
        </div>
      </div>` + html
    : '<p class="empty">没有匹配的接口</p>'

  main.querySelectorAll('.ep-head').forEach(h => {
    h.onclick = () => h.parentElement.classList.toggle('open')
  })
  main.querySelectorAll('[data-copy]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation()
      navigator.clipboard.writeText(location.origin + b.dataset.copy)
      const t = b.textContent; b.textContent = '已复制'; setTimeout(() => (b.textContent = t), 1200)
    }
  })
  main.querySelectorAll('[data-run]').forEach(b => {
    b.onclick = async e => {
      e.stopPropagation()
      const key = b.dataset.run
      const box = b.closest('.ep')
      const it = findItem(key)
      const view = box.querySelector(`[data-out="${key}"]`)
      const bodyEl = view.querySelector('[data-body]')
      const stEl = view.querySelector('[data-st]')
      const msEl = view.querySelector('[data-ms]')
      view.hidden = false
      stEl.className = 'chip'
      stEl.textContent = '请求中…'
      msEl.hidden = true
      bodyEl.textContent = ''

      const vals = {}
      box.querySelectorAll('[data-p]').forEach(i => {
        if (i.value === '') return
        // 数组类型参数尝试 JSON 解析，失败则按字符串传递
        if (i.dataset.t && i.dataset.t.endsWith('[]')) {
          try { vals[i.dataset.p] = JSON.parse(i.value) } catch (_) { vals[i.dataset.p] = i.value }
        } else {
          vals[i.dataset.p] = i.value
        }
      })
      const headers = {}
      const uid = box.querySelector('[data-h="x-user-id"]')
      if (uid && uid.value !== '') headers['X-User-Id'] = uid.value

      let raw = ''
      const t0 = performance.now()
      try {
        let url = it.p
        const opt = { method: it.m }
        if (it.m === 'GET') {
          const qs = new URLSearchParams(vals).toString()
          if (qs) url += '?' + qs
          if (Object.keys(headers).length) opt.headers = headers
        } else {
          opt.headers = { 'Content-Type': 'application/json', ...headers }
          opt.body = JSON.stringify(vals)
        }
        const res = await fetch(url, opt)
        raw = await res.text()
        const ms = Math.round(performance.now() - t0)
        stEl.textContent = 'HTTP ' + res.status
        stEl.classList.add('s' + String(res.status)[0])
        msEl.hidden = false
        msEl.textContent = ms + ' ms'
        view.dataset.raw = raw
      } catch (err) {
        stEl.textContent = '请求失败'
        stEl.classList.add('s5')
        view.dataset.raw = ''
        bodyEl.textContent = err.message
        return
      }

      let pretty = raw
      let isJson = false
      try { pretty = JSON.stringify(JSON.parse(raw), null, 2); isJson = true } catch (_) {}
      if (pretty.length > 20000) pretty = pretty.slice(0, 20000) + '\n… （响应过长已截断）'
      bodyEl.innerHTML = isJson ? highlight(pretty) : esc(pretty)
    }
  })
  main.querySelectorAll('[data-copyresp]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation()
      navigator.clipboard.writeText(b.closest('.resp').dataset.raw || '')
      const t = b.textContent; b.textContent = '已复制'; setTimeout(() => (b.textContent = t), 1200)
    }
  })
}

document.getElementById('q').addEventListener('input', render)

document.getElementById('theme').onclick = () => {
  const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'
  document.documentElement.dataset.theme = next
  try { localStorage.setItem('boycot-theme', next) } catch (e) {}
}

;(async function health () {
  const el = document.getElementById('status')
  const txt = document.getElementById('status-text')
  try {
    const r = await fetch('/api/v1/index')
    const j = await r.json()
    const ok = r.ok && j.code === 0
    el.classList.add(ok ? 'ok' : 'err')
    txt.textContent = ok ? '服务正常' : '异常 ' + r.status
  } catch (e) {
    el.classList.add('err'); txt.textContent = '无法连接'
  }
})()

render()
</script>
</body>
</html>
